<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تست مدل مانی | چیدو</title><style>body{margin:0;background:#ede9e2;color:#252821;font:16px Tahoma,sans-serif}main{display:grid;grid-template-columns:minmax(280px,1fr) 320px;min-height:100vh}#view{min-height:65vh;touch-action:none}aside{padding:24px;background:#faf8f3}h1{font-size:22px}button{padding:12px;margin:4px;border:1px solid #bbb;border-radius:8px;background:white;cursor:pointer}p{line-height:1.9}label{display:block;padding:12px 0}input[type=range]{width:100%}@media(max-width:720px){main{grid-template-columns:1fr}aside{padding:16px}}canvas{display:block;width:100%;height:100%}</style><main><div id="view"></div><aside><h1>مبل مانی</h1><p>نور بیک‌شده، سایهٔ داخل فایل و چوب و پارچهٔ مستقل. برای چرخاندن نما روی تصویر بکش.</p><p id="status" role="status">در حال خواندن مدل…</p><h2>چوب</h2><div id="wood"></div><h2>پارچه</h2><div id="fabric"></div><button id="reset">متریال اصلی هر دو بخش</button><label><input type="checkbox" id="collider"> نمایش محدودهٔ کالیژن فایل</label><label>حرکت مبل دوم برای تست برخورد<input id="move" type="range" min="0" max="180" value="180"></label><p id="collisionStatus"></p><a href="index.html">ورود به اپلیکیشن چیدو</a></aside></main><script type="module" src="model-test.js?v=0.16.16"></script></html>
