<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#184e45"><title>چیدمان مجموعه — چیدو</title><link rel="stylesheet" href="central.css?v=0.12.0"><link rel="stylesheet" href="company.css?v=0.12.0"></head>
<body class="studio-page"><header class="studio-header"><div><h1 id="studioTitle">چیدمان مجموعه</h1><p id="studioCompany" class="form-help">در حال بررسی دسترسی…</p></div><div class="studio-tools"><button id="viewFront">نمای روبه‌رو</button><button id="viewTop">نمای بالا</button><a class="secondary" href="company.html#sets">بازگشت به مجموعه</a></div></header>
<main class="studio-layout"><aside class="studio-properties"><form id="layoutForm"><label>نام چیدمان<input id="layoutName" required maxlength="120" placeholder="مثلاً پذیرایی روشن"></label><label>فضا<select id="layoutRoom"><option>پذیرایی</option><option>اتاق خواب</option><option>ناهارخوری</option><option>دفتر کار</option></select></label><label>تعداد نفر<input id="layoutCapacity" type="number" value="5" min="1" max="30" required></label><button class="primary" type="submit" disabled id="saveLayout">ذخیره چیدمان</button></form><hr><label>محصول این ست<select id="productSelect"></select></label><button class="secondary" id="addProduct" disabled>افزودن محصول</button><label>محصول انتخاب‌شده<select id="itemSelect"><option value="">هیچ‌کدام</option></select></label><div class="studio-tools"><button id="rotateItem">چرخش ۴۵°</button><button id="removeItem">حذف از چیدمان</button></div><label>رنگ محصول<input id="itemColor" type="color" value="#b6bca2"></label><label id="fabricField" hidden>پارچه مبل<select id="itemFabric"><option value="dark">آبی تیره</option><option value="creme">کرم</option><option value="gray">خاکستری</option></select></label><hr><form id="colorwayForm"><label>رنگ‌بندی موجود<select id="colorwaySelect"><option value="">رنگ‌بندی جدید</option></select></label><label>نام رنگ‌بندی<input id="colorwayName" required maxlength="120"></label><button class="primary" type="submit" id="saveColorway" disabled>ذخیره رنگ‌بندی</button></form><p id="studioLimit" class="form-help"></p><p id="studioMessage" class="message" role="status"></p></aside><section id="studioStage" class="studio-stage" aria-label="ویرایشگر سه‌بعدی"><p class="studio-hint">محصول را انتخاب و روی کف جابه‌جا کن. برای تغییر زاویه از دکمه‌های بالا استفاده کن.</p></section></main><script type="module" src="company-studio.js?v=0.13.2"></script></body></html>
