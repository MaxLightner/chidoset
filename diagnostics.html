<body><main><h1>گزارش خطای چیدو</h1><p>بعد از بروز مشکل، این صفحه را در همان مرورگر باز کن. گزارش سه بار آخر باز شدن اپ نگه داشته می‌شود. کپی کردن گزارش، آن را پاک نمی‌کند.</p><p>نام کاربری، رمز و چیدمان در این گزارش ثبت نمی‌شوند. ارسال خودکار ندارد.</p><nav aria-label="کارهای گزارش"><button type="button" id="copyReport">کپی گزارش</button><button type="button" id="downloadReport">دانلود گزارش</button><a href="index.html?v=0.15.0#welcome">بازگشت به اپ</a></nav><p id="reportStatus" role="status">در حال خواندن گزارش…</p><label for="reportText">متن گزارش</label><textarea id="reportText" dir="ltr" readonly spellcheck="false"></textarea></main><script type="module" src="diagnostics.js?v=0.15.0"></script></body></html>
